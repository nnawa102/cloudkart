name: CloudKart CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run PyTest Suite
      run: |
        pytest -v

    - name: Build Docker Image
      run: |
        docker build -t cloudkart-service:${{ github.sha }} .

    - name: Test Docker Container Health
      run: |
        docker run -d -p 5000:5000 --name test-container cloudkart-service:${{ github.sha }}
        sleep 4
        curl --fail http://127.0.0.1:5000/health || exit 1
        docker stop test-container
